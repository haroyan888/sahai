name: CI

# push/PRのたびにテストとlintを回す。リリース用ワークフローはタグpush時にしか
# 動かないため、これが無いと壊れたまま気付けない。
on:
  push:
    branches: ["main", "master"]
  pull_request:

# 同じブランチへ続けてpushしたとき、古い実行を打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # LinuxのTLSはnative-tls経由でシステムのOpenSSLに動的リンクする
      - name: Install OpenSSL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # ビルドより先に置く。整形漏れはコンパイルを待たずに分かる
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Docker実機を要するe2eテストは#[ignore]付きのため既定で除外される。
      # ホストの/var/sahaiへbind mountするので、CIで回すと環境を汚す。
      - name: Test
        run: cargo test --workspace

  # setup.sh/clean.sh等はこれまでCIの対象外だった。利用者が最初に触る部分であり、
  # 壊れても他のジョブでは気付けないため、専用のジョブで検査する。
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Windows上で作成したファイルはcore.filemode=falseのため100644で記録され、
      # cloneしても実行できない(実際に踏んだ)。gitのindex上のモードを直接見る
      - name: Shell scripts are executable
        run: |
          for f in setup.sh clean.sh; do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::実行ビットがありません (mode=$mode)。'git update-index --chmod=+x $f' を実行してください"
              exit 1
            fi
          done

      - name: Shell syntax
        run: bash -n setup.sh && bash -n clean.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in @('setup.ps1', 'clean.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { $failed = $true; $errors | ForEach-Object { Write-Host "::error file=$f::$($_.Message)" } }
          }
          if ($failed) { exit 1 }

      - name: Compose file is valid
        run: docker compose -f compose.yaml config --quiet

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Dockerfileのweb-builderと同じメジャーバージョンに合わせる
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx oxlint --deny-warnings

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
