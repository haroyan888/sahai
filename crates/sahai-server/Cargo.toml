[package]
name = "sahai-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sahai-server"
path = "src/main.rs"

[dependencies]
sahai-core = { path = "../sahai-core" }

tokio = { workspace = true }
axum = { version = "0.8.9", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
# SPAフォールバック(api/mod.rs)からServeFileをリクエスト単位で呼ぶため
tower = { version = "0.5", features = ["util"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "migrate"] }
bollard = "0.16"
futures-util = "0.3"
async-trait = "0.1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tar = "0.4"
flate2 = "1"
# APIトークンの定数時間比較(auth.rs)。公開環境での運用を想定するため、
# 素の`==`による早期リターンでトークンの一致長が漏れないようにする
subtle = "2"

[dev-dependencies]
# 0002マイグレーションの回帰テストで、sqlxが使うchecksumアルゴリズム(SHA-384)を
# そのまま計算するため(repo::testsのapplying_0002_...参照)
sha2 = "0.10"
