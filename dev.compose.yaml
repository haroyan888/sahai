# 開発用の完結したcomposeファイル。本番の compose.yaml には依存せず、
# このファイル単体で traefik・sahai-server・web・registry の4サービスすべてが
# 完結する。
#
# 使い方:
#   cp dev.env.example dev.env   # 初回のみ。ポート等をデフォルトから変えたい場合に編集
#   docker compose -f dev.compose.yaml --env-file dev.env up -d --build
#
# 開発ではsetup.shを使わない。setup.shが対話で聞く項目はすべてdev.envから渡し、
# sahai-serverがDBの空な初回起動時にシードする(settings.rs::seed_from_envと
# main.rsのシード条件を参照)。そのため初期設定画面を通らずに起動できる。
# ただしシードされるのは初回だけで、以後はDBの値が正になる(dev.env.example参照)。
#
# 公開ポートを持つのはtraefikのみ(既定80。dev.envのSAHAI_TRAEFIK_HTTP_PORTで変更可)。
# sahai-server・web・registryはdockerネットワーク内部のみで完結し、すべて
# Traefik経由でアクセスする(本番と同じ「Traefikだけが外向きに出る」トポロジー)。
#
# - sahai-server: リポジトリをbindマウントし、リリースビルド済みバイナリではなく
#   `cargo run`で起動する(ソースを編集して再起動すればcargoの増分コンパイルで
#   すぐ反映される)
# - web: 同様にbindマウントし、`npm run dev`(Viteのホットリロード開発サーバー)で
#   起動する
#
# Web UI・APIは本番ではsahai-server自身が単一のTraefikルートとして配信するが、
# 開発時はweb/sahai-serverを別コンテナのまま起動するため、
# sahai-server自身が書き出すルート(常に自分自身への単一マージルート)の代わりに
# traefik/dev-dynamic/dev-routes.yml という開発専用の静的ルートでパス分割している
# (/api/* → sahai-server、それ以外 → web)。このルートはTraefik自身の環境変数
# SAHAI_DOMAINを参照するため、**dev.envのSAHAI_DOMAINとDBのドメインは常に
# 一致させること**(詳細はdev-routes.yml参照)。
#
# 生成されるデータのルートは本番の/var/sahaiではなくプロジェクト直下の./data。
# 本番データを汚さないためと、Windows開発機ではDocker Desktopの/varがVM内にあり
# ホストから中身を覗けないため(container-design.md「開発時のデータルート」参照)。
# 配下の構造は本番の/var/sahaiとまったく同じにしてある。
services:
  # registryのhtpasswdをdev.envの値から作る使い捨てコンテナ。本番でsetup.shが
  # 対話で作るものに相当し、開発ではこれによりdev.envが唯一の設定元になる。
  # 資格情報が未設定なら空のhtpasswdを置く。ファイルが存在しないとregistryが
  # 「htpasswd is missing, provisioning with default user」でランダムな資格情報を
  # 勝手に作ってしまい、dev.envの値と食い違うため(空ファイルなら誰も認証できないだけ)
  registry-auth-init:
    image: httpd:2.4-alpine
    volumes:
      # 本番の /var/sahai/registry-auth に対応する開発時の置き場
      - ./data/registry-auth:/auth
    environment:
      - SAHAI_REGISTRY_USERNAME=${SAHAI_REGISTRY_USERNAME:-}
      - SAHAI_REGISTRY_PASSWORD=${SAHAI_REGISTRY_PASSWORD:-}
    # パスワードは標準入力から渡す。引数に置くとコンテナのプロセス一覧や
    # docker inspectのCmdに平文で残る
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$SAHAI_REGISTRY_USERNAME" ] || [ -z "$$SAHAI_REGISTRY_PASSWORD" ]; then
          : > /auth/htpasswd
          echo "レジストリ資格情報が未設定のため、空のhtpasswdを作成しました。"
        else
          printf '%s' "$$SAHAI_REGISTRY_PASSWORD" \
            | htpasswd -Bni "$$SAHAI_REGISTRY_USERNAME" > /auth/htpasswd
          echo "htpasswdを作成しました(ユーザー名: $$SAHAI_REGISTRY_USERNAME)。"
        fi
    networks:
      - sahai

  registry:
    image: registry:2
    depends_on:
      registry-auth-init:
        condition: service_completed_successfully
    volumes:
      - ./data/registry:/var/lib/registry
      - ./data/registry-auth:/auth:ro
    environment:
      - REGISTRY_AUTH=htpasswd
      - REGISTRY_AUTH_HTPASSWD_REALM=Registry Realm
      - REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd
    networks:
      - sahai
    # 外部公開しない。registry.sahai.<domain>経由でTraefikからのみ到達させる

  traefik:
    image: traefik:v3.1
    # Traefikは静的設定を単一のソースからのみ読み込み、--configFile使用時は他の
    # CLIフラグ・環境変数からの静的設定が無視される
    # (https://github.com/traefik/traefik/issues/7545)。そのため全ての静的設定を
    # CLIフラグに統一し、--configFileは使わない
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/var/sahai/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=INFO
      - --api.dashboard=false
      - --certificatesresolvers.letsencrypt.acme.email=${SAHAI_ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      # 既定値は持たない(compose.yamlと同じ理由。開発ではSAHAI_DOMAIN=localhostの
      # 自己署名証明書運用が前提のため、通常は未設定のままで問題ない)
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=${SAHAI_DNS_PROVIDER:-}
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
    volumes:
      # docker.sockはマウントしない(本番のcompose.yamlと同じ理由)
      # sahai-server(dev)と共有する動的ルートディレクトリ。本番と違い読み書き可能で
      # マウントする(この下に開発専用の静的ルートを1ファイルだけ重ねてbind-mountする
      # ため。:roのままだとマウントポイントを作成できない罠を過去に踏んでいる)
      - ./data/traefik/dynamic:/var/sahai/traefik/dynamic
      - ./traefik/dev-dynamic/dev-routes.yml:/var/sahai/traefik/dynamic/dev-routes.yml:ro
      - ./data/traefik/acme:/acme
    # DNSプロバイダの認証情報は、sahai-server自身が/var/sahai/.sahai.envを読み、
    # bollard経由でこのコンテナを再作成する際に直接Envとして渡す設計に統一している
    # (traefik::container::recreate_traefik参照。本番のcompose.yaml参照)
    environment:
      # dev-routes.ymlのHost()ルールがGoテンプレート({{ env "SAHAI_DOMAIN" }})で
      # 参照する。Web UIの初期設定画面で入力するドメインと同じ値をここにも
      # 設定しておくこと(この環境変数はコンテナ起動時に一度だけ読まれるため、
      # 初期設定画面だけで変更してもTraefik側のルールには反映されない)
      - SAHAI_DOMAIN=${SAHAI_DOMAIN:-localhost}
      # dev-routes.ymlが平文http用ルーターを書き出すかの判定に使う。trueのときは
      # sahai-server側のhttps→リダイレクトルーターに任せる(dev-routes.yml参照)
      - SAHAI_HTTPS_REDIRECT=${SAHAI_HTTPS_REDIRECT:-false}
    ports:
      # 公開ポートを持つのはtraefikのみ(このcomposeファイル全体でここだけ)
      - "${SAHAI_TRAEFIK_HTTP_PORT:-80}:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sahai

  sahai-server:
    image: sahai-server-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 開発時のデータルートはプロジェクト直下の./data(Windowsホストから中身を
      # 覗けるようにするため。container-design.md「開発時のデータルート」参照)。
      # コンテナ内のパスは本番と同じ/var/sahaiのままにすること。この値は
      # naming::volume_host_pathがサービスの永続ボリュームのbindマウント元を
      # 組み立てるのに使われ、そのままdockerdへホスト側パスとして渡るため
      - ./data:/var/sahai
      # ホストのリポジトリをそのままbindマウントし、編集がすぐコンテナに反映される
      - .:/app
      # cargoのビルドキャッシュ・依存キャッシュは名前付きボリュームに逃がす。
      # 上の`.:/app`だけだと/app/targetがホストのtarget/と同じ場所になってしまい、
      # この開発機でネイティブに実行するcargo build/test(ホストOS向け)の成果物と
      # コンテナ内cargo run(Linux向け)の成果物が衝突するため
      - cargo_target_dev:/app/target
      - cargo_registry_dev:/usr/local/cargo/registry
    command: cargo run -p sahai-server
    environment:
      - SAHAI_BIND_ADDR=0.0.0.0:8080
      # コンテナ内から見えるデータルート。本番と同じ/var/sahaiに揃える
      - SAHAI_DATA_ROOT=/var/sahai
      # 同じ場所をdockerdから見たときのパス。サービスの永続ボリュームの
      # bindマウント元だけはこちらから組み立てる(config.rs参照)。
      # ${PWD}はComposeが自前で注入するためPowerShellでも解決される。ただし
      # composeファイルの位置ではなく**シェルのカレントディレクトリ**なので、
      # docker composeはプロジェクトルートから実行すること
      - SAHAI_HOST_DATA_ROOT=${PWD}/data
      # 以下はDBが空の初回起動時にだけ読まれるシード用。設定してあれば初期設定画面を
      # 通らずにconfigured状態で起動する(SAHAI_API_TOKENとSAHAI_DOMAINの両方が
      # 非空であることがシードの条件)。以降はDBの値が正で、これらは無視される
      - SAHAI_API_TOKEN=${SAHAI_API_TOKEN:-}
      - SAHAI_DOMAIN=${SAHAI_DOMAIN:-localhost}
      # Traefikのregistryルートは常にregistry.sahai.<domain>を待ち受けるため
      # (route_writer.rs)、既定値もそれに揃える
      - SAHAI_REGISTRY_URL=${SAHAI_REGISTRY_URL:-registry.sahai.${SAHAI_DOMAIN:-localhost}}
      - SAHAI_HTTPS_REDIRECT=${SAHAI_HTTPS_REDIRECT:-false}
      - SAHAI_DOCKER_HOST_ADDRESS=host.docker.internal
      - SAHAI_REGISTRY_INTERNAL_URL=${SAHAI_REGISTRY_INTERNAL_URL:-http://registry:5000}
      # `sahai service create`(サーバー側build+push)を検証する場合のみ設定する。
      # 同じ値からregistry-auth-initがhtpasswdを作るため、両者は常に一致する
      - SAHAI_REGISTRY_USERNAME=${SAHAI_REGISTRY_USERNAME:-}
      - SAHAI_REGISTRY_PASSWORD=${SAHAI_REGISTRY_PASSWORD:-}
      # 実ドメインで証明書取得まで確認する場合のみ設定する。プロバイダ固有の認証情報
      # (CF_DNS_API_TOKEN等)はここからは渡せず、Web UIの「DNS/証明書設定」から
      # 入力する必要がある(保存先の.sahai.envはsahai-server自身が書くファイルで、
      # 環境変数から取り込む経路が無いため)
      - SAHAI_DNS_PROVIDER=${SAHAI_DNS_PROVIDER:-}
      - SAHAI_ACME_EMAIL=${SAHAI_ACME_EMAIL:-}
    networks:
      - sahai
    # 外部公開しない。dev-routes.ymlのdev-apiルート(sahai.localhost/api/*)経由で
    # Traefikからのみ到達させる

  web:
    image: sahai-web-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: web-dev
    volumes:
      - ./web:/app/web
      # ホスト側のnode_modules(OS依存のネイティブモジュールを含みうる)を
      # コンテナ内に持ち込まないよう、名前付きボリュームでnode_modulesだけ上書きする
      - web_node_modules:/app/web/node_modules
    environment:
      # Traefik経由で同一オリジンとしてアクセスするため相対パスのままでよい
      - VITE_API_BASE_URL=
      # Docker(特にWindows/macOSホスト上のDocker Desktop)経由のbindマウントでは
      # ネイティブのファイルシステムイベントが伝播しないことが多いため、
      # ポーリング監視にフォールバックする(vite.config.ts側でも設定済み)
      - CHOKIDAR_USEPOLLING=true
    networks:
      - sahai
    # 外部公開しない。dev-routes.ymlのdev-web-uiルート経由でTraefikからのみ到達させる

networks:
  sahai:
    # 名前を固定する。既定ではdocker composeがプロジェクト名
    # (クローン先のディレクトリ名)を前置するため、サービス側からexternalとして
    # 参照できなくなる。サービスのコンテナはこのネットワークに参加し、
    # Traefikがコンテナ名で直接到達する
    name: sahai
    driver: bridge

volumes:
  cargo_target_dev:
  cargo_registry_dev:
  web_node_modules:
