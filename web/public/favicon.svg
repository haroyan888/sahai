<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>差配 - 長屋</title>
  <!-- 空色の空に、藍鉄の瓦屋根と生成りの壁 -->
  <rect width="48" height="48" rx="10" fill="#A0D8EF"/>
  <!-- 全戸に架かる一続きの屋根。軒を長く取り勾配を浅くして「低く長い」姿にする
       (勾配を立てると社寺の破風に見え、棟木を足すと鬼瓦の角ができる) -->
  <path d="M3 21.4H45L40 13.4H8Z" fill="#39434B"/>
  <!-- 大棟。屋根の上端(x=8〜40)と面一にして、上へわずかに出す。
       上端より広げると両端が斜面の上に張り出し、鬼瓦のような角に見える -->
  <rect x="8" y="12.75" width="32" height="0.75" fill="#39434B"/>
  <!-- 妻壁。屋根の左端の三角を一回り小さくしたもので、周りに残る屋根が破風になる。
       壁と同色にして、下の壁面と一続きの塗り面として見せる -->
  <polygon points="8,14.4 4.25,20.75 12.7,20.75" fill="#F0E9DC"/>
  <rect x="6" y="21.5" width="36" height="20" fill="#F0E9DC"/>
  <!-- 開口は左から 戸・窓・戸・窓。同じ幅の縦棒を等間隔に並べると柱列
       (銀行や神殿)に見えるため、戸と窓で高さの違う開口を交互に置いている。
       色は屋根と揃える。背景色にすると空が抜けて見えてしまう。
       縦線で分かれた広いほうの面(x=11.5〜42)の中央に置く。
       戸と窓の間は1.2、戸どうしの間は4.5。組の中より組の間を広く取ることで
       二戸が別々の住まいとして読める -->
  <g fill="#39434B">
    <rect x="16.5" y="27" width="5.5" height="14"/>
    <rect x="23.4" y="27" width="3.2" height="4"/>
    <rect x="29" y="27" width="5.5" height="14"/>
    <rect x="35.7" y="27" width="3.2" height="4"/>
  </g>
  <!-- 左端寄りに背景色の縦線を通し、端の一区画を切り離す -->
  <rect x="11.25" y="21.7" width="0.5" height="20" fill="#A0D8EF"/>
</svg>
