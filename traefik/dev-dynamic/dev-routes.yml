# 開発用compose(dev.compose.yaml)専用の静的Traefikルート。
#
# 本番ではWeb UI(静的ファイル)とAPIをsahai-server自身が単一コンテナ・単一の
# Traefikルートとして配信するが(route_writer.rs参照)、開発時はsahai-server(cargo run)と
# web(npm run dev/Vite)を別コンテナのまま起動してホットループを優先するため、
# sahai-server自身が書き出すルートの代わりにこのファイルでパス分割している
# (/api/* → sahai-server:8080、それ以外 → web:5173)。
#
# Host()のドメイン部分はTraefikのfile provider(Goテンプレート)機能で
# `{{ env "SAHAI_DOMAIN" }}` により、Traefikコンテナ自身の環境変数SAHAI_DOMAIN
# (dev.compose.yaml参照)から動的に埋め込む。2026-07-23、ハードコードだと
# LAN内の別端末から独自ドメイン経由でアクセスしたい場合にこのファイルのルールが
# 一切マッチせず、sahai-server自身が書き出す(動的にdomainを読むので追従する)
# admin routeへフォールバックしてしまい、dev用sahai-serverはビルド済み静的
# ファイルを持たないため古い/空のレスポンスになる問題があったための変更。
#
# **注意**: これらの環境変数はTraefikコンテナ起動時に一度だけ読まれる。Web UIの
# 初期設定画面(またはSettings画面)で入力するドメインと、`dev.env`の
# SAHAI_DOMAINは必ず同じ値にすること(片方だけ変えても一致しなくなり、
# このファイルのルールがマッチしなくなる)。
#
# priority: 200はsahai-server自身が書き出すadmin route(priority 100)より確実に
# 高くしてある。Host()がsahai.<domain>限定なので、他の登録済みサービス
# (myapp.<domain>等、動的に生成されるper-serviceルート)とは競合しない。
#
# **web(:80)用とwebsecure(:443)用でルーターを2本に分けている**理由:
# `tls`キーの有無がプロトコル可用性を直接左右する(route_writer.rsのコメントにある
# 実機検証結果と同じ制約)。`tls`を持つルーターはwebsecure専用になりweb(:80)では
# 一切応答せず、`tls`を持たないルーターはweb専用になりwebsecure(:443)では応答しない。
# 単一ルーターで両プロトコルに応答させることはできない。
#
# 平文http用(`-web`側)はSAHAI_HTTPS_REDIRECT=trueのときだけ書き出さない。
# trueのときはsahai-serverが書き出す`sahai_https_redirect`ルーターがweb(:80)宛てを
# httpsへ301するので、ここでweb(:80)を横取りするとリダイレクトが効かなくなるため
# (このルーターのpriority 200が`sahai_https_redirect`のpriority 1に勝ってしまう)。
http:
  routers:
    dev-web-ui-tls:
      rule: 'Host(`sahai.{{ env "SAHAI_DOMAIN" }}`) && !PathPrefix(`/api`)'
      service: dev-web-ui
      priority: 200
      entryPoints:
      - websecure
      tls: {}
    dev-api-tls:
      rule: 'Host(`sahai.{{ env "SAHAI_DOMAIN" }}`) && PathPrefix(`/api`)'
      service: dev-api
      priority: 200
      entryPoints:
      - websecure
      tls: {}
{{ if ne (env "SAHAI_HTTPS_REDIRECT") "true" }}
    dev-web-ui-web:
      rule: 'Host(`sahai.{{ env "SAHAI_DOMAIN" }}`) && !PathPrefix(`/api`)'
      service: dev-web-ui
      priority: 200
      entryPoints:
      - web
    dev-api-web:
      rule: 'Host(`sahai.{{ env "SAHAI_DOMAIN" }}`) && PathPrefix(`/api`)'
      service: dev-api
      priority: 200
      entryPoints:
      - web
{{ end }}
  services:
    dev-web-ui:
      loadBalancer:
        servers:
          - url: "http://web:5173"
    dev-api:
      loadBalancer:
        servers:
          - url: "http://sahai-server:8080"
